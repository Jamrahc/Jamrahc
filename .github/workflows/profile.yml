name: Profile assets

on:
  schedule:
    - cron: "17 0 * * *"   # daily, 06:17 Dhaka time
  workflow_dispatch:         # run it by hand from the Actions tab
  push:
    branches: [main]
    paths-ignore: ["assets/stats-*.svg"]

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render stats panel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}
        run: python scripts/stats.py
      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats-*.svg
          git diff --cached --quiet || git commit -m "chore: refresh stats panel"
          git push

  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#79c0ff&color_dots=#161b22,#0c2d6b,#1158c7,#388bfd,#79c0ff
            dist/snake-light.svg?palette=github-light&color_snake=#0969da&color_dots=#eff2f5,#b6e3ff,#54aeff,#0969da,#0a3069
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
